name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly (Monday 06:00 UTC) so newly published CVEs surface in govulncheck early.
    - cron: "0 6 * * 1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Lint & Vulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.3
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - name: Run govulncheck
        run: govulncheck ./...

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Locate Go build cache
        id: gocache
        run: echo "path=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
      # Separate cache for -race build artifacts (setup-go only caches the non-race build).
      # Restored on every run; saved only on main so PRs read it but never write it.
      - name: Restore race build cache
        id: race-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.gocache.outputs.path }}
          key: go-race-${{ runner.os }}-${{ hashFiles('**/go.sum') }}-${{ github.run_id }}
          restore-keys: |
            go-race-${{ runner.os }}-${{ hashFiles('**/go.sum') }}-
            go-race-${{ runner.os }}-
      - name: Run tests
        env:
          CGO_ENABLED: "1"
        run: go test ./... -race -coverprofile=coverage.txt -v
      - name: Save race build cache
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.gocache.outputs.path }}
          key: go-race-${{ runner.os }}-${{ hashFiles('**/go.sum') }}-${{ github.run_id }}
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  build:
    name: Build
    uses: ./.github/workflows/build.yml
    with:
      artifact-name: qlx-binary

  e2e:
    name: E2E Tests
    needs: [build]
    # Pinned: ubuntu-latest is now 26.04, which Playwright 1.58 does not support.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - uses: actions/download-artifact@v8
        with:
          name: qlx-binary
      - name: Make binary executable
        run: chmod +x qlx
      - name: Move binary for fixture
        run: mv qlx qlx-e2e-test
      - name: Install E2E dependencies
        working-directory: e2e
        run: npm ci
      - name: Get Playwright version
        id: playwright-version
        working-directory: e2e
        run: echo "version=$(npx playwright --version | tr ' ' '-')" >> $GITHUB_OUTPUT
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: e2e
        run: npx playwright install chromium --with-deps
      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: e2e
        run: npx playwright install-deps chromium
      - name: Run E2E tests
        working-directory: e2e
        run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
